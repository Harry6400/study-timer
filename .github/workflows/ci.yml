name: macOS CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      STUDYTIMER_BUILD_ROOT: ${{ runner.temp }}/studytimer-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          uname -m
          swift --version
          xcrun --show-sdk-version
      - name: Test
        run: ./scripts/test.sh
      - name: Release build
        run: ./scripts/build-app.sh
